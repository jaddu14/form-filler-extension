<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Form Filler</title>
  <style>
    body { font-family: Arial, sans-serif; width: 360px; padding: 12px; }
    textarea { width: 100%; height: 160px; margin-bottom: 10px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; cursor: pointer; font-size: 14px; }
    button:hover { background: #45a049; }
    .note { font-size:12px; color:#444; margin-bottom:8px; }
  </style>
</head>
<body>
  <h3>Form Filler</h3>
  <div class="note">Paste mapping lines like:<br><code>Name* (Shubham Kumar)</code> or <code>State* slect from dropdown(Jharkhand)</code></div>
  <textarea id="mappingText" placeholder="Paste your mapping text here..."></textarea>
  <button id="fillForm">Fill Form</button>

  <script src="popup.js"></script>
</body>
</html>
